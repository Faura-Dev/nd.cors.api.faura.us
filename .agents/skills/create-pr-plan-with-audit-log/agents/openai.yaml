    short_description: 'Plan and stage non-trivial code changes'
    default_prompt: 'Use $create-pr-plan-with-audit-log to plan and stage this non-trivial code change through the gated PR-plan workflow.'

policy:
    allow_implicit_invocation: true

dependencies:
