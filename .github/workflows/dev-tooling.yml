name: Dev Tooling
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dev-tooling-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@faura-dev"
      - run: npm exec --yes --package=@faura-dev/dev-tooling@1.12.0 -- dev-tooling check --json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dev-tooling-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@faura-dev"
      - run: npm exec --yes --package=@faura-dev/dev-tooling@1.12.0 -- dev-tooling diff
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
